<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub 加速 & 通用代理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        [hidden] {
            display: none !important;
        }

        /* ========== 亮色主题（默认） ========== */
        :root,
        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f6f8fa;
            --border-primary: #d0d7de;
            --border-secondary: #e1e4e8;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --text-tertiary: #8b949e;
            --accent: #5865f2;
            --accent-gradient: linear-gradient(135deg, #5865f2, #8957e5);
            --accent-bg: rgba(88, 101, 242, 0.06);
            --accent-border: rgba(88, 101, 242, 0.3);
            --link-color: #0969da;
            --success: #1a7f37;
            --danger: #cf222e;
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.1);
            --gradient-bg: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(88, 101, 242, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(137, 87, 229, 0.04), transparent);
            --toast-bg: #1f2328;
            --toast-color: #ffffff;
        }

        /* ========== 暗色主题 ========== */
        [data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-card: #161b22;
            --bg-input: #0d1117;
            --border-primary: #30363d;
            --border-secondary: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-tertiary: #6e7681;
            --accent: #5865f2;
            --accent-bg: rgba(88, 101, 242, 0.08);
            --accent-border: rgba(88, 101, 242, 0.25);
            --link-color: #58a6ff;
            --success: #3fb950;
            --danger: #f85149;
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);
            --gradient-bg: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(88, 101, 242, 0.12), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(137, 87, 229, 0.06), transparent);
            --toast-bg: #2d333b;
            --toast-color: #e6edf3;
        }

        body {
            min-height: 100vh;
            padding: 48px 16px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient-bg);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 720px;
            position: relative;
            z-index: 1;
        }

        /* ========== 主题切换 ========== */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 42px;
            height: 42px;
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
            box-shadow: var(--shadow-md);
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
        }

        .theme-toggle:hover svg {
            fill: var(--accent);
        }

        .theme-toggle .icon-sun {
            display: none;
        }

        [data-theme="dark"] .theme-toggle .icon-sun {
            display: block;
        }

        [data-theme="dark"] .theme-toggle .icon-moon {
            display: none;
        }

        /* ========== 头部 ========== */
        header {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            background: var(--accent-gradient);
            border-radius: 15px;
            margin-bottom: 10px;
            box-shadow: 0 8px 24px rgba(88, 101, 242, 0.25);
        }

        .logo svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        h1 {
            font-weight: 700;
            font-size: 1.75rem;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        /* ========== 卡片 / 结果面板（同款容器）========== */
        .card,
        .result {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-md);
            margin-bottom: 14px;
        }

        /* ========== 输入行 / 结果行（同款内嵌框）========== */
        .input-row,
        .result-body {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--bg-input);
            border: 1px solid var(--border-secondary);
            border-radius: 12px;
        }

        .input-row {
            padding: 5px 5px 5px 14px;
            transition: all 0.2s;
        }

        .input-row:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-border);
        }

        .input-row>svg {
            width: 20px;
            height: 20px;
            fill: var(--text-tertiary);
            flex-shrink: 0;
        }

        .url-input {
            flex: 1;
            min-width: 0;
            padding: 11px 0;
            font-size: 15px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            outline: none;
        }

        .url-input::placeholder {
            color: var(--text-tertiary);
        }

        .primary-btn {
            padding: 10px 24px;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .primary-btn:hover {
            opacity: 0.9;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.35);
        }

        /* ========== 字段与 chips ========== */
        .field {
            margin-top: 16px;
        }

        .field-label {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .field-note {
            font-size: 0.7rem;
            padding: 0 6px;
            border: 1px solid var(--border-primary);
            border-radius: 999px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* chips 与结果区按钮共用基础样式 */
        .chip,
        .mini-btn {
            font-size: 0.85rem;
            border: 1px solid var(--border-primary);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip:hover,
        .mini-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .chip.active,
        .mini-btn.primary {
            background: var(--accent-gradient);
            border-color: transparent;
            color: #fff;
        }

        .chip {
            padding: 6px 14px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .chip-tag {
            font-size: 0.68rem;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--success);
            color: #fff;
        }

        /* ========== 结果 ========== */
        .result-top {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .badge {
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 999px;
            background: var(--accent-bg);
            border: 1px solid var(--accent-border);
            color: var(--accent);
        }

        .result-hint {
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }

        .result-body {
            padding: 12px 14px;
        }

        .result-body code {
            flex: 1;
            min-width: 180px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.9rem;
            color: var(--link-color);
            word-break: break-all;
        }

        .result-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .mini-btn {
            padding: 6px 16px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .mini-btn.primary:hover {
            opacity: 0.9;
            color: #fff;
        }

        .mini-btn.copied {
            border-color: var(--success);
            color: var(--success);
        }

        .result-error {
            margin-top: 10px;
            font-size: 0.88rem;
            color: var(--danger);
        }

        /* ========== 说明与页脚 ========== */
        .tips {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            text-align: center;
            line-height: 1.8;
            margin-top: 16px;
            margin-bottom: 10px;
        }

        .footer {
            text-align: center;
            color: var(--text-tertiary);
            font-size: 0.85rem;
        }

        /* ========== Toast ========== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--toast-bg);
            color: var(--toast-color);
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 0.95rem;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 640px) {
            body {
                padding: 28px 14px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .subtitle {
                font-size: 0.88rem;
            }

            .card {
                padding: 14px;
            }

            .input-row {
                flex-wrap: wrap;
                padding: 10px;
            }

            .input-row>svg {
                display: none;
            }

            .url-input {
                flex: 1 1 100%;
                padding: 4px 0;
            }

            .primary-btn {
                width: 100%;
            }

            .theme-toggle {
                top: 12px;
                right: 12px;
                width: 38px;
                height: 38px;
            }
        }
    </style>
</head>

<body>
    <button class="theme-toggle" id="themeToggle" title="切换夜间模式">
        <svg class="icon-moon" viewBox="0 0 16 16">
            <path
                d="M9.598 1.591a.75.75 0 0 1 .785-.175 7 7 0 1 1-8.967 8.967.75.75 0 0 1 .961-.96 5.5 5.5 0 0 0 7.22-7.832z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 16 16">
            <path
                d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0zm0 13a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13zM2.343 2.343a.75.75 0 0 1 1.061 0l1.06 1.061a.75.75 0 0 1-1.06 1.06l-1.06-1.06a.75.75 0 0 1 0-1.06zm9.193 9.193a.75.75 0 0 1 1.06 0l1.061 1.06a.75.75 0 0 1-1.06 1.061l-1.061-1.06a.75.75 0 0 1 0-1.06zM16 8a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 16 8zM3 8a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 3 8zm10.657-5.657a.75.75 0 0 1 0 1.061l-1.061 1.06a.75.75 0 1 1-1.06-1.06l1.06-1.06a.75.75 0 0 1 1.06 0zm-9.193 9.193a.75.75 0 0 1 0 1.06l-1.06 1.061a.75.75 0 1 1-1.061-1.06l1.06-1.061a.75.75 0 0 1 1.061 0z" />
        </svg>
    </button>

    <main class="container">
        <header>
            <div class="logo">
                <svg viewBox="0 0 16 16">
                    <path
                        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
                </svg>
            </div>
            <h1>GitHub 加速 &amp; 通用代理</h1>
            <p class="subtitle">GitHub 链接走 5 个加速节点，其他任意链接走云函数代理</p>
        </header>

        <section class="card">
            <div class="input-row">
                <svg viewBox="0 0 16 16">
                    <path
                        d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0zm-.82 4.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04z" />
                </svg>
                <input type="text" class="url-input" id="urlInput"
                    placeholder="粘贴任意链接，或简写 user/repo" autocomplete="off" />
                <button type="button" class="primary-btn" id="submitBtn">转换</button>
            </div>

            <div class="field">
                <div class="field-label">加速通道</div>
                <div class="chips" id="channelRow">
                    <button type="button" class="chip active" data-channel="auto">自动识别</button>
                    <button type="button" class="chip" data-channel="github">GitHub 节点</button>
                    <button type="button" class="chip" data-channel="edge">云函数代理</button>
                </div>
            </div>

            <div class="field" id="nodeField">
                <div class="field-label">加速节点 <span class="field-note">仅 GitHub</span></div>
                <div class="chips" id="nodeRow"></div>
            </div>

            <div class="field">
                <div class="field-label">解析方式</div>
                <div class="chips" id="formatRow">
                    <button type="button" class="chip active" data-format="raw">原始链接</button>
                    <button type="button" class="chip" data-format="git">Git Clone</button>
                    <button type="button" class="chip" data-format="wget">Wget</button>
                    <button type="button" class="chip" data-format="curl">cURL</button>
                </div>
            </div>
        </section>

        <section class="result" id="resultPanel" hidden>
            <div class="result-top">
                <span class="badge" id="resultBadge"></span>
                <span class="result-hint" id="resultHint"></span>
            </div>
            <div class="result-body" id="resultBody">
                <code id="resultUrl"></code>
                <div class="result-actions">
                    <button type="button" class="mini-btn" id="copyBtn">复制</button>
                    <button type="button" class="mini-btn primary" id="openBtn">打开</button>
                </div>
            </div>
            <p class="result-error" id="resultError" hidden></p>
        </section>

        <section class="field">
            <div class="field-label">快捷示例</div>
            <div class="chips" id="exampleRow"></div>
        </section>

        <p class="tips">
            加速节点仅支持 GitHub 相关链接（仓库 / Release / Raw / Gist / API 等），其余任意网址由云函数代理转发（限 6M 以内）。
        </p>

        <p class="footer">&copy; 2026 GitHub 加速服务 &middot; 提升您的下载与访问体验</p>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var urlInput = document.getElementById('urlInput');
            var submitBtn = document.getElementById('submitBtn');
            var channelRow = document.getElementById('channelRow');
            var nodeRow = document.getElementById('nodeRow');
            var nodeField = document.getElementById('nodeField');
            var formatRow = document.getElementById('formatRow');
            var exampleRow = document.getElementById('exampleRow');
            var resultPanel = document.getElementById('resultPanel');
            var resultBody = document.getElementById('resultBody');
            var resultUrl = document.getElementById('resultUrl');
            var resultBadge = document.getElementById('resultBadge');
            var resultHint = document.getElementById('resultHint');
            var resultError = document.getElementById('resultError');
            var copyBtn = document.getElementById('copyBtn');
            var openBtn = document.getElementById('openBtn');
            var toast = document.getElementById('toast');
            var themeToggle = document.getElementById('themeToggle');
            var html = document.documentElement;

            // ========== 加速节点（写死，仅用于 GitHub 链接）==========
            var NODES = [{
                id: 'cf',
                domain: 'gh-proxy.org',
                desc: '主站加速，全球高速分发'
            }, {
                id: 'hk',
                domain: 'v4.gh-proxy.org',
                desc: '优选节点，仅支持 IPv4',
                recommended: true
            }, {
                id: 'v6',
                domain: 'v6.gh-proxy.org',
                desc: '优选节点，支持 IPv6/IPv4'
            }, {
                id: 'cdn',
                domain: 'cdn.gh-proxy.org',
                desc: 'Fastly CDN 节点加速'
            }, {
                id: 'axisnow',
                domain: 'axisnow.gh-proxy.org',
                desc: '三网优选节点，仅支持 IPv4'
            }];

            // ========== GitHub 相关域名 ==========
            var GITHUB_HOSTS = [
                'github.com', 'www.github.com', 'raw.githubusercontent.com',
                'gist.github.com', 'gist.githubusercontent.com', 'api.github.com',
                'avatars.githubusercontent.com', 'desktop.githubusercontent.com',
                'objects.githubusercontent.com', 'codeload.github.com'
            ];

            var FORMAT_NAMES = { raw: '原始链接', git: 'Git Clone', wget: 'Wget', curl: 'cURL' };

            var EXAMPLES = [
                { label: '仓库主页', url: 'https://github.com/dyang886/Game-Cheats-Manager' },
                { label: 'Release 资产', url: 'https://github.com/WJQSERVER-STUDIO/ghproxy/releases/download/4.3.4/ghproxy-linux-amd64.tar.gz' },
                { label: '分支源码', url: 'https://github.com/WJQSERVER-STUDIO/ghproxy/archive/refs/heads/main.zip' },
                { label: 'Tag 源码', url: 'https://github.com/vuejs/core/archive/refs/tags/v3.5.13.tar.gz' },
                { label: 'Raw 文件', url: 'https://raw.githubusercontent.com/WJQSERVER-STUDIO/ghproxy/main/config/config.toml' },
                { label: '仓库文件', url: 'https://github.com/torvalds/linux/blob/master/COPYING' },
                { label: 'Git 克隆', url: 'https://github.com/WJQSERVER-STUDIO/ghproxy.git', format: 'git' },
                { label: 'GitHub API', url: 'https://api.github.com/repos/vuejs/core' },
                { label: '豆瓣接口', url: 'https://movie.douban.com/j/search_subjects?type=movie&tag=%E7%83%AD%E9%97%A8&sort=recommend&page_limit=16' },
                { label: 'Bing 图片', url: 'https://cn.bing.com/th?id=OHR.SaguaroSun_EN-US8982109543_UHD.jpg&rf=LaDigue_UHD.jpg&pid=hp&w=3840' }
            ];

            var DEFAULT_NODE = NODES.filter(function (n) { return n.recommended; })[0] || NODES[0];

            var channel = 'auto';    // auto | github | edge
            var format = 'raw';      // raw | git | wget | curl
            var nodeId = DEFAULT_NODE.id;
            var currentUrl = '';     // 用于「打开」的加速/代理链接
            var currentText = '';    // 用于「复制」的链接或指令

            // ========== chips 渲染与选中 ==========
            function createChip(label, title) {
                var chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'chip';
                chip.textContent = label;
                chip.title = title || '';
                return chip;
            }

            function setActive(row, key, value) {
                Array.prototype.forEach.call(row.children, function (btn) {
                    btn.classList.toggle('active', btn.dataset[key] === value);
                });
            }

            NODES.forEach(function (n) {
                var chip = createChip(n.domain, n.desc);
                chip.dataset.node = n.id;
                if (n.id === nodeId) chip.classList.add('active');
                if (n.recommended) {
                    var tag = document.createElement('span');
                    tag.className = 'chip-tag';
                    tag.textContent = '推荐';
                    chip.appendChild(tag);
                }
                nodeRow.appendChild(chip);
            });

            EXAMPLES.forEach(function (ex) {
                var chip = createChip(ex.label, ex.url);
                chip.addEventListener('click', function () {
                    urlInput.value = ex.url;
                    // 示例决定解析方式：Git 克隆示例切到 Git Clone，其余回到原始链接
                    setFormat(ex.format || 'raw');
                    convert();
                    urlInput.focus();
                });
                exampleRow.appendChild(chip);
            });

            function getNode(id) {
                return NODES.filter(function (n) { return n.id === id; })[0] || DEFAULT_NODE;
            }

            // ========== 链接解析 ==========
            function isGitHubUrl(url) {
                try {
                    var hostname = new URL(url).hostname;
                    return GITHUB_HOSTS.some(function (h) {
                        return hostname === h || hostname.endsWith('.' + h);
                    });
                } catch (e) {
                    return false;
                }
            }

            // 支持完整链接、裸域名、user/repo 简写，并剥离已有加速前缀
            function normalizeUrl(input) {
                var s = (input || '').trim();
                if (!s) return '';

                if (s.indexOf('%') > -1) {
                    try { s = decodeURIComponent(s); } catch (e) { }
                }
                s = s.trim();
                s = s.replace(/^(?:https?:\/\/)?(?:[a-zA-Z0-9-]+\.)*gh-proxy\.(?:com|org)\/+(https?:\/\/)?/i,
                    function (m, p) { return p || 'https://'; });

                if (/^https?:/i.test(s)) {
                    try { return new URL(s).href; } catch (e) { return ''; }
                }
                if (/^(?:www\.)?github\.com|githubusercontent\.com|gist\.github\.com|api\.github\.com/i.test(s)) {
                    return 'https://' + s.replace(/^\/+/, '');
                }
                if (s.indexOf('.') === -1 && s.indexOf('/') > -1 && s.indexOf('..') === -1) {
                    var parts = s.split('/').filter(Boolean);
                    if (parts.length >= 2) {
                        return 'https://github.com/' + parts[0] + '/' + parts[1].replace(/\.git$/, '');
                    }
                }
                if (/^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+/.test(s)) {
                    return 'https://' + s;
                }
                return '';
            }

            // 返回 { url, channel } 或 { error }
            function resolve(input) {
                var url = normalizeUrl(input);
                if (!url) return { error: '请输入有效的链接' };

                var github = isGitHubUrl(url);
                var ch = channel === 'auto' ? (github ? 'github' : 'edge') : channel;

                if (ch === 'github' && !github) {
                    return { error: '加速节点仅支持 GitHub 相关链接，请切换为「云函数代理」' };
                }

                if (format === 'git') {
                    if (ch !== 'github' || !github) {
                        return { error: 'Git Clone 仅支持走加速节点的 github.com 仓库链接' };
                    }
                    var u = new URL(url);
                    var segs = u.pathname.split('/').filter(Boolean);
                    if (!/^(www\.)?github\.com$/i.test(u.hostname) || segs.length < 2) {
                        return { error: 'Git Clone 需要一个有效的仓库链接（例如 user/repo）' };
                    }
                    url = u.origin + '/' + segs[0] + '/' + segs[1].replace(/\.git$/, '') + '.git';
                }

                return { url: url, channel: ch };
            }

            // GitHub 走加速节点，其他一律走云函数代理（协议占位符防拦截）
            function buildProxyUrl(url, ch, node) {
                if (ch === 'github') return 'https://' + node.domain + '/' + url;
                return location.origin + '/e/' + encodeURIComponent(url)
                    .replace('https%3A', 'ht-tps%3A')
                    .replace('http%3A', 'ht-tp%3A');
            }

            function wrapCommand(url) {
                if (format === 'git') return 'git clone ' + url;
                if (format === 'wget') return 'wget "' + url + '"';
                if (format === 'curl') return 'curl -LO "' + url + '"';
                return url;
            }

            // ========== 转换与渲染 ==========
            function convert() {
                var input = urlInput.value.trim();
                if (!input) {
                    showToast('请输入链接');
                    urlInput.focus();
                    return false;
                }

                resultPanel.hidden = false;
                var res = resolve(input);

                if (res.error) {
                    resultBody.hidden = true;
                    nodeField.hidden = channel === 'edge';
                    resultBadge.textContent = '';
                    resultHint.textContent = '';
                    resultError.hidden = false;
                    resultError.textContent = res.error;
                    return false;
                }

                var node = getNode(nodeId);
                currentUrl = buildProxyUrl(res.url, res.channel, node);
                currentText = wrapCommand(currentUrl);

                resultBody.hidden = false;
                resultError.hidden = true;
                nodeField.hidden = res.channel !== 'github';
                resultUrl.textContent = currentText;
                resultBadge.textContent = res.channel === 'github' ? 'GitHub 加速 · ' + node.domain : '云函数代理';
                resultHint.textContent = FORMAT_NAMES[format] + ' · ' +
                    (res.channel === 'github' ? node.desc : '任意网址（限 6M 以内）');
                return true;
            }

            // ========== 交互事件 ==========
            // 三组 chips 行为一致：写入状态 → 更新选中态 → 已输入则重新转换
            function bindChips(row, key, apply) {
                row.addEventListener('click', function (e) {
                    var btn = e.target.closest('.chip');
                    if (!btn) return;
                    apply(btn.dataset[key]);
                    setActive(row, key, btn.dataset[key]);
                    if (urlInput.value.trim()) convert();
                });
            }

            function setFormat(next) {
                format = next;
                setActive(formatRow, 'format', format);
            }

            function submit() {
                if (convert()) showToast('转换成功');
            }

            copyBtn.addEventListener('click', function () {
                copyText(currentText, copyBtn, '复制');
            });

            openBtn.addEventListener('click', function () {
                window.open(currentUrl, '_blank');
            });

            submitBtn.addEventListener('click', submit);

            urlInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') submit();
            });

            bindChips(channelRow, 'channel', function (v) { channel = v; });
            bindChips(nodeRow, 'node', function (v) { nodeId = v; });
            bindChips(formatRow, 'format', function (v) { format = v; });

            // ========== 主题切换 ==========
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                html.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                html.setAttribute('data-theme', 'dark');
            }

            themeToggle.addEventListener('click', function () {
                var current = html.getAttribute('data-theme');
                var next = current === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                themeToggle.title = next === 'dark' ? '切换亮色模式' : '切换夜间模式';
            });

            // ========== Toast ==========
            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(function () {
                    toast.classList.remove('show');
                }, 2200);
            }

            // ========== 复制（含降级方案）==========
            function copyText(text, btn, resetLabel) {
                function done() {
                    btn.textContent = '已复制';
                    btn.classList.add('copied');
                    setTimeout(function () {
                        btn.textContent = resetLabel;
                        btn.classList.remove('copied');
                    }, 1500);
                }

                function fallback() {
                    var ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); } catch (e) { }
                    document.body.removeChild(ta);
                    done();
                }

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(done).catch(fallback);
                } else {
                    fallback();
                }
            }
        });
    </script>
</body>

</html>
